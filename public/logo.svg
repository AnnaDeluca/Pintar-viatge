<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF8EC"/>
      <stop offset="1" stop-color="#F3E6C9"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C98A4B"/>
      <stop offset="1" stop-color="#A96A33"/>
    </linearGradient>
  </defs>

  <!-- fons (full-bleed per a icones maskable) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- pinzellada ondulada terracota -->
  <path d="M74 338 C150 258 212 362 288 300 C336 262 362 290 390 268"
        fill="none" stroke="#23323E" stroke-width="92" stroke-linecap="round"/>
  <path d="M74 338 C150 258 212 362 288 300 C336 262 362 290 390 268"
        fill="none" stroke="#D85B3C" stroke-width="72" stroke-linecap="round"/>
  <!-- reflex de pintura humida -->
  <path d="M96 320 C152 272 202 340 268 292" fill="none" stroke="#E8826A"
        stroke-width="22" stroke-linecap="round" opacity="0.85"/>

  <!-- gotes de pintura -->
  <circle cx="118" cy="152" r="30" fill="#2E6A9E" stroke="#23323E" stroke-width="10"/>
  <circle cx="194" cy="108" r="20" fill="#E0A52E" stroke="#23323E" stroke-width="10"/>
  <circle cx="398" cy="402" r="26" fill="#4E8C6A" stroke="#23323E" stroke-width="10"/>

  <!-- pinzell (inclinat, tocant el final de la pinzellada) -->
  <g transform="rotate(25 400 236)">
    <rect x="381" y="98" width="38" height="96" rx="19" fill="url(#wood)" stroke="#23323E" stroke-width="10"/>
    <rect x="377" y="186" width="46" height="30" rx="10" fill="#C8CDD4" stroke="#23323E" stroke-width="10"/>
    <path d="M381 212 L427 212 L414 262 Q404 280 395 262 Z" fill="#D85B3C" stroke="#23323E" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
